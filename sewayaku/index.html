<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世話役掲示板</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; line-height: 1.6; }
        .hidden { display: none; }
        .diary-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; }
        .btn-group button { margin-left: 5px; }
        input[type="text"], textarea { width: 100%; margin: 10px 0; padding: 5px; box-sizing: border-box; }
        textarea { height: 100px; }
        button { cursor: pointer; padding: 5px 10px; }
        .nav-btn { margin-bottom: 20px; }
        #loading { text-align: center; font-weight: bold; color: #666; margin: 20px 0; }
        .post-date-label { font-size: 0.85em; color: #666; margin-left: 8px; font-weight: normal; }
    </style>
</head>
<body>

    <!-- ローディング表示 -->
    <div id="loading">データを読み込み中...</div>

    <!-- ================= トップページビュー ================= -->
    <div id="view-top" class="hidden">
        <h1>📅 世話役掲示板</h1>
        <!-- 管理者用追加フォーム -->
        <fieldset id="admin-form">
            <legend>新規投稿の追加</legend>
            <label>日付: <input type="date" id="input-date"></label><br>
            <label>投稿タイトル:<br><input type="text" id="input-title" placeholder="タイトルを入力..."></label><br>
            <label>内容:<br><textarea id="input-content" placeholder="コンテンツを数行で入力..."></textarea></label><br>
            <button id="btn-create">追加する</button>
        </fieldset>
        <h2>過去の投稿一覧</h2>
        <div id="post-list"></div>
    </div>

    <!-- ================= 下層ページ（詳細）ビュー ================= -->
    <div id="view-detail" class="hidden">
        <button class="nav-btn" id="btn-back">← 一覧に戻る</button>
        <h1 id="detail-title-display"></h1>
        <div id="detail-display-mode">
            <p id="detail-text" style="white-space: pre-wrap; background: #f9f9f9; padding: 15px; border-radius: 5px;"></p>
            <button id="btn-to-edit">✏️ 編集する</button>
            <button id="btn-copy-url">🔗 閲覧専用のURLをコピー</button>
        </div>
        <!-- 編集フォーム -->
        <div id="detail-edit-mode" class="hidden">
            <label>投稿タイトル:<br><input type="text" id="edit-title"></label><br>
            <label>内容:<br><textarea id="edit-content"></textarea></label><br>
            <button id="btn-update-save">保存</button>
            <button id="btn-edit-cancel">キャンセル</button>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 【重要】あなた自身の Firebase 設定情報に書き換えてください！
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyAT6nmTEDmj1-15b6FFLx75uQwL7JWU_Kc",
            authDomain: "hs-portal-5537c.firebaseapp.com",
            databaseURL: "https://hs-portal-5537c-default-rtdb.firebaseio.com",
            projectId: "hs-portal-5537c",
            storageBucket: "hs-portal-5537c.firebasestorage.app"
        };

        // 💡 世話役掲示板専用の引き出し（posts_sewayaku.json）に設定
        const baseDbUrl = firebaseConfig.databaseURL.endsWith('/') 
            ? firebaseConfig.databaseURL + 'posts_sewayaku.json' 
            : firebaseConfig.databaseURL + '/posts_sewayaku.json';

        let postData = {};

        // データの読み込み関数
        function fetchAllPosts() {
            fetch(baseDbUrl)
                .then(res => res.json())
                .then(data => {
                    postData = data || {};
                    // データが空（null）でも確実にローディングを隠す
                    document.getElementById('loading').classList.add('hidden');
                    
                    const params = new URLSearchParams(window.location.search);
                    const dateParam = params.get('date');
                    
                    if (dateParam && postData[dateParam]) {
                        showDetailView(dateParam);
                    } else {
                        showTopView();
                    }
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "データの読み込みに失敗しました。";
                    console.error(err);
                });
        }

        // --- ルーティング関数 ---
        function showTopView() {
            const params = new URLSearchParams(window.location.search);
            const isViewMode = params.get('mode') === 'view';

            if (!isViewMode) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                history.pushState({}, '', cleanUrl);
                document.getElementById('admin-form').classList.remove('hidden');
            } else {
                document.getElementById('admin-form').classList.add('hidden');
            }
            
            document.getElementById('view-top').classList.remove('hidden');
            document.getElementById('view-detail').classList.add('hidden');
            renderList();
            
            // 今日の日付をデフォルトで自動セット
            document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('input-title').value = '';
            document.getElementById('input-content').value = '';
        }

        function showDetailView(postKey) {
            const params = new URLSearchParams(window.location.search);
            const isViewMode = params.get('mode') === 'view';
            
            if (isViewMode) {
                history.pushState({}, '', `?date=${postKey}&mode=view`);
                document.getElementById('btn-back').classList.remove('hidden'); 
                document.getElementById('btn-to-edit').classList.add('hidden');  
            } else {
                history.pushState({}, '', `?date=${postKey}`);
                document.getElementById('btn-back').classList.remove('hidden');
                document.getElementById('btn-to-edit').classList.remove('hidden');
            }

            document.getElementById('view-top').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');
            
            const displayDate = postKey.substring(0, 10);
            const postObj = typeof postData[postKey] === 'object' ? postData[postKey] : { title: "無題", content: postData[postKey] };
            
            document.getElementById('detail-title-display').innerHTML = `📝 ${postObj.title} <span class="post-date-label">(${displayDate})</span>`;

            // URLの自動リンク化処理
            let rawText = postObj.content;
            let escapedText = rawText
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let linkedText = escapedText.replace(urlRegex, function(url) {
                return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
            });

            document.getElementById('detail-text').innerHTML = linkedText;
            switchEditMode(false);
        }
        // --- リスト描画 ---
        function renderList() {
            const listContainer = document.getElementById('post-list');
            listContainer.innerHTML = '';
            
            const params = new URLSearchParams(window.location.search);
            const isViewMode = params.get('mode') === 'view';
            
            const sortedKeys = Object.keys(postData).sort((a, b) => b.localeCompare(a));
            if (sortedKeys.length === 0 || (sortedKeys.length === 1 && postData[sortedKeys] === "")) {
                listContainer.innerHTML = '<p>投稿がまだありません。</p>';
                return;
            }

            sortedKeys.forEach(postKey => {
                if (postData[postKey] === "") return;

                const displayDate = postKey.substring(0, 10);
                const item = document.createElement('div');
                item.className = 'diary-item';
                
                const postObj = typeof postData[postKey] === 'object' ? postData[postKey] : { title: "（タイトルなし）", content: postData[postKey] };

                if (isViewMode) {
                    item.innerHTML = `
                        <a href="?date=${postKey}&mode=view" class="post-link"><strong>${postObj.title}</strong> <span style="color:#666; font-size:0.85em; margin-left:5px;">(${displayDate})</span></a>
                    `;
                } else {
                    item.innerHTML = `
                        <a href="?date=${postKey}" class="post-link"><strong>${postObj.title}</strong> <span style="color:#666; font-size:0.85em; margin-left:5px;">(${displayDate})</span></a>
                        <div class="btn-group">
                            <button class="view-btn">表示/編集</button>
                            <button class="del-btn" style="color:red;">削除</button>
                        </div>
                    `;
                }

                item.querySelector('.post-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    showDetailView(postKey);
                });
                
                if (!isViewMode) {
                    item.querySelector('.view-btn').addEventListener('click', () => showDetailView(postKey));
                    item.querySelector('.del-btn').addEventListener('click', () => deletePost(postKey));
                }

                listContainer.appendChild(item);
            });
        }

        // --- 保存機能 ---
        function createPost() {
            const dateInput = document.getElementById('input-date').value;
            const titleInput = document.getElementById('input-title').value.trim();
            const contentInput = document.getElementById('input-content').value.trim();

            if (!dateInput) return alert('日付を選択してください。');
            if (!titleInput) return alert('タイトルを入力してください。');
            if (!contentInput) return alert('コンテンツを入力してください。');

            const uniqueKey = dateInput + "_" + Date.now();

            const singleUrl = firebaseConfig.databaseURL.endsWith('/')
                ? `${firebaseConfig.databaseURL}posts_sewayaku/${uniqueKey}.json`
                : `${firebaseConfig.databaseURL}/posts_sewayaku/${uniqueKey}.json`;

            const saveData = { title: titleInput, content: contentInput };

            fetch(singleUrl, { method: 'PUT', body: JSON.stringify(saveData) })
            .then(() => {
                alert(`「${titleInput}」を追加しました！`);
                fetchAllPosts();
            })
            .catch(err => alert('保存エラー: ' + err.message));
        }

        function switchEditMode(isEdit) {
            const currentParam = new URLSearchParams(window.location.search).get('date');
            const postObj = typeof postData[currentParam] === 'object' ? postData[currentParam] : { title: "", content: postData[currentParam] };

            if (isEdit) {
                document.getElementById('edit-title').value = postObj.title;
                document.getElementById('edit-content').value = postObj.content;
                document.getElementById('detail-display-mode').classList.add('hidden');
                document.getElementById('detail-edit-mode').classList.remove('hidden');
            } else {
                document.getElementById('detail-display-mode').classList.remove('hidden');
                document.getElementById('detail-edit-mode').classList.add('hidden');
            }
        }

        // --- 編集機能 ---
        function updatePostDetail() {
            const currentParam = new URLSearchParams(window.location.search).get('date');
            const updatedTitle = document.getElementById('edit-title').value.trim();
            const updatedContent = document.getElementById('edit-content').value.trim();
            
            if (!updatedTitle) return alert('タイトルを入力してください。');
            if (!updatedContent) return alert('コンテンツを入力してください。');

            const singleUrl = firebaseConfig.databaseURL.endsWith('/')
                ? `${firebaseConfig.databaseURL}posts_sewayaku/${currentParam}.json`
                : `${firebaseConfig.databaseURL}/posts_sewayaku/${currentParam}.json`;
            
            const saveData = { title: updatedTitle, content: updatedContent };

            fetch(singleUrl, { method: 'PUT', body: JSON.stringify(saveData) })
            .then(() => {
                switchEditMode(false);
                alert('変更を保存しました。');
                fetchAllPosts();
            });
        }

        // --- 削除機能 ---
        function deletePost(postKey) {
            const postObj = typeof postData[postKey] === 'object' ? postData[postKey] : { title: "この投稿", content: "" };
            if (!confirm(`「${postObj.title}」を削除してもよろしいですか？`)) return;

            const singleUrl = firebaseConfig.databaseURL.endsWith('/')
                ? `${firebaseConfig.databaseURL}posts_sewayaku/${postKey}.json`
                : `${firebaseConfig.databaseURL}/posts_sewayaku/${postKey}.json`;

            fetch(singleUrl, { method: 'DELETE' })
            .then(() => {
                alert(`投稿を削除しました。`);
                fetchAllPosts();
            });
        }

        function copyDetailURL() {
            const currentParam = new URLSearchParams(window.location.search).get('date');
            const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            const viewUrl = `${baseUrl}?date=${currentParam}&mode=view`;
            
            navigator.clipboard.writeText(viewUrl).then(() => {
                alert('閲覧専用のURLをコピーしました！\n' + viewUrl);
            }).catch(err => alert('コピーに失敗しました。'));
        }

        // イベントリスナー設定
        document.getElementById('btn-create').addEventListener('click', createPost);
        document.getElementById('btn-back').addEventListener('click', showTopView);
        document.getElementById('btn-to-edit').addEventListener('click', () => switchEditMode(true));
        document.getElementById('btn-edit-cancel').addEventListener('click', () => switchEditMode(false));
        document.getElementById('btn-update-save').addEventListener('click', updatePostDetail);
        document.getElementById('btn-copy-url').addEventListener('click', copyDetailURL);

        fetchAllPosts();
    </script>
</body>
</html>
